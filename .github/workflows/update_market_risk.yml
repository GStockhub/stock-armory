name: Update Market Risk

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit generated market risk files"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      backfill_days:
        description: "回填廣度收盤歷史天數(首次啟用填 90,平日留空)"
        required: false
        default: ""
  schedule:
    # Taiwan 21:30 weekdays; margin (MI_MARGN) publishes late evening,
    # 期交所/廣度/國際資料此時也都齊了。
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

jobs:
  update-market-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 yfinance

      - name: Run market risk ETL
        run: |
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            python market_risk_provider.py --backfill ${{ github.event.inputs.backfill_days }}
          else
            python market_risk_provider.py
          fi

      - name: Commit generated data
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit_changes == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_risk_history.csv data/market_breadth_close_history.csv.gz
          if git diff --cached --quiet; then
            echo "No market risk changes"
          else
            git commit -m "Update market risk"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
